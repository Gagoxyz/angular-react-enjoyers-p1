<div class="card shadow-sm">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0">Listado de Jugadores</h5>
  </div>

  <ul class="list-group list-group-flush">
    @for (player of players; track player.id) {
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
        [class.active]="player.id === selectedPlayerId"
        (click)="selectPlayer(player)"
        style="cursor: pointer;"
      >
        <div>
          <strong>{{ player.nombre }} {{ player.apellidos }}</strong><br>
          <small>
            {{ player.posicion }} · {{ player.edad }} años · {{ player.altura }} cm
          </small>
        </div>

        <span class="badge bg-secondary">{{ player.id }}</span>
      </li>
    }
  </ul>
</div>
