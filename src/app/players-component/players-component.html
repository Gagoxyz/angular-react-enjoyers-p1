<div class="players-container">
  <h2>Lista de Jugadores</h2>

  <button (click)="showList = !showList">
    {{ showList ? 'Ocultar lista' : 'Mostrar lista' }}
  </button>

  <div *ngIf="showList; else noPlayers" class="players-grid">
    <div *ngFor="let player of players; trackBy: trackById" class="player-card" (click)="onSelect(player)" tabindex="0" (keydown.enter)="onSelect(player)" (keydown.space)="onSelect(player)">
      <img [src]="player.image" [alt]="player.name" class="player-image">
      <div class="player-info">
        <h3>{{ player.name }}</h3>
        <p><strong>Posición:</strong> {{ player.position }}</p>
        <p><strong>Edad:</strong> {{ player.age }} años</p>
      </div>
    </div>
  </div>

  <ng-template #noPlayers>
    <p>No hay jugadores disponibles.</p>
  </ng-template>

  <app-detail-component [player]="selectedPlayer"></app-detail-component>
</div>
